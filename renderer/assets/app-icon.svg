       [alpha.169] โลโก้ที่ผู้ใช้ออกแบบ (ฉบับสี): วงกลมไล่สี #FF6640 → #150C36 · ขนนกเป็นช่องโปร่ง — ใช้บนพื้นสว่าง + เป็นไอคอนของ exe
