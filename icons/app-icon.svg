<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- [alpha.168] ไอคอนของโปรแกรม (exe · แถบงาน · dmg) — ชุดสีของธีม k2 · ยังเป็นรูปชั่วคราว
       เปลี่ยนรูป = แก้/แทนที่ไฟล์นี้ แล้วรัน:  ./node_modules/electron/dist/electron.exe tools/make-icon.cjs
       (สร้าง build/icon.ico + build/icon.png ที่ electron-builder หยิบไปใช้เอง) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a66"/>
      <stop offset="1" stop-color="#452f5e"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffc55c" stroke-opacity=".28" stroke-width="12"/>
  <text x="512" y="640" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="460" font-weight="800" letter-spacing="-16" fill="#ffc55c">K2</text>
  <rect x="270" y="712" width="484" height="40" rx="20" fill="#ff6640"/>
</svg>
