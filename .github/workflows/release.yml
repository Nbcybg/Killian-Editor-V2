# สร้างตัวโปรแกรมทุกระบบแล้วแนบเข้า GitHub Release — [2.0.0-alpha.release.1]
#
# ทำงานเมื่อ push tag ที่ขึ้นต้นด้วย v (เช่น v2.0.0-alpha.release.1) หรือสั่งเองจากแท็บ Actions → release → Run workflow
#   1) สร้าง Release ของ tag นั้น (ถ้ายังไม่มี) ด้วยข้อความจาก .github/release-notes.md
#   2) สร้างตัวโปรแกรมบนเครื่องของแต่ละระบบ แล้วแนบไฟล์เข้า Release เดียวกัน
#        Windows  → Killian2-<ver>-win-x64-portable.exe
#        macOS    → Killian2-<ver>-mac-x64.dmg (Intel) + Killian2-<ver>-mac-arm64.dmg (Apple Silicon)   (.dmg สร้างได้บน macOS เท่านั้น)
#        Linux    → Killian2-<ver>-linux-x64.AppImage
#   ชื่อไฟล์มาจาก build.*.artifactName ใน package.json — ปุ่มดาวน์โหลดใน README ชี้ชื่อเหล่านี้ตรง ๆ
#   ตัวอัปเดตในโปรแกรมเลือกไฟล์จากชื่อเดียวกัน (src/update/update-check.js → pickAsset)
#
# [alpha.170 · ข้อ 4] ลงนาม/notarize อัตโนมัติ **เมื่อรีโปมี secrets** (macOS: Developer ID · Windows: SignPath หรือ Azure Artifact Signing)
#   ไม่มี secrets = ไม่ลงนามเหมือนเดิม — วิธีตั้งค่าทั้งหมดอยู่ docs/signing.md · แนบ SHA256SUMS-<ระบบ>.txt ทุกรอบ
# ไม่มีข้อความจากผู้ใช้ถูกนำไปรันเป็นคำสั่ง — ใช้แค่ชื่อ tag ของรีโปเอง
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag ที่จะสร้าง/แนบไฟล์ เช่น v2.0.0-alpha.release.1'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Create the release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG มีอยู่แล้ว"
          else
            gh release create "$TAG" --verify-tag --title "Killian 2 ${TAG#v}" --notes-file .github/release-notes.md
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win portable --x64
            files: dist/*.exe
            pattern: '*.exe'
          - os: macos-latest
            target: --mac dmg --x64 --arm64
            files: dist/*.dmg
            pattern: '*.dmg'
          - os: ubuntu-latest
            target: --linux AppImage --x64
            files: dist/*.AppImage
            pattern: '*.AppImage'
    runs-on: ${{ matrix.os }}
    env:
      # [alpha.170 · ข้อ 4] ลงนาม Windows ทาง SignPath เมื่อมี secret เท่านั้น (ไม่มี = ไม่ลงนาม เหมือนเดิม)
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Bundle
        run: node build.js
      - name: Package
        shell: bash
        env:
          # [alpha.170 · ข้อ 4] ค่าการลงนามทุกตัวมาจาก secrets/vars ของรีโป — ตัวไหนไม่ได้ตั้ง = สตริงว่าง
          # = build/electron-builder.config.cjs ไม่เปิดการลงนามของระบบนั้น (docs/signing.md)
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 != '') && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          K2_AZURE_ENDPOINT: ${{ vars.K2_AZURE_ENDPOINT }}
          K2_AZURE_ACCOUNT: ${{ vars.K2_AZURE_ACCOUNT }}
          K2_AZURE_PROFILE: ${{ vars.K2_AZURE_PROFILE }}
          K2_AZURE_PUBLISHER: ${{ vars.K2_AZURE_PUBLISHER }}
        run: npx electron-builder ${{ matrix.target }} --publish never --config build/electron-builder.config.cjs
      # ── [alpha.170 · ข้อ 4] Windows ทาง SignPath Foundation (ฟรีสำหรับโอเพนซอร์ส) — ลงนามไฟล์ที่ build แล้ว ──
      - name: Upload the unsigned exe for SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Sign with SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      - name: Use the signed exe
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: bash
        run: |
          ls -la dist-signed
          cp -f dist-signed/*.exe dist/
      # ── บอกสถานะลายเซ็นในบันทึกของ Actions (ไม่ลงนาม = เห็นว่า NotSigned · ไม่ทำให้ล้ม) ──
      - name: Signature status (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "{0} -> {1} {2}" -f $_.Name, $s.Status, $s.SignerCertificate.Subject
          }
      - name: Signature status (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for a in dist/mac*/*.app; do
            echo "== $a"
            codesign -dv --verbose=2 "$a" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature' || echo 'not signed'
            spctl -a -vv "$a" 2>&1 || true
          done
      # ── [alpha.170 · ข้อ 4] SHA-256 ของทุกไฟล์ — ผู้ใช้ตรวจได้ว่าไฟล์ที่โหลดมาตรงกับที่ Actions สร้าง ──
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in ${{ matrix.pattern }}; do
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > "SHA256SUMS-${RUNNER_OS}.txt"
          cat "SHA256SUMS-${RUNNER_OS}.txt"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "$TAG" ${{ matrix.files }} dist/SHA256SUMS-*.txt --clobber
